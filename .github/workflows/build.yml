name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    # Match the Linux release build so runner upgrades do not change dependencies.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: Install APT packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config libao-dev libcurl4-openssl-dev libgcrypt20-dev libjson-c-dev \
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswresample-dev \
          libwebsockets-dev libasound2-dev libblas-dev liblapack-dev python3-yaml
    # Default `make` enables HAVE_DEBUGLOG; use debug=N in config or PIANOBAR_DEBUG at runtime.
    - name: Build pianobar (debug symbols for PRs)
      if: github.event_name == 'pull_request'
      run: make CFLAGS="-g -O0"
    - name: Build pianobar (release on main)
      if: github.event_name != 'pull_request'
      run: make
