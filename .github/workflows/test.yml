name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libao-dev libavcodec-dev libavformat-dev \
            libavutil-dev libavfilter-dev libjson-c-dev libgcrypt20-dev \
            libcurl4-openssl-dev libwebsockets-dev libasound2-dev \
            libblas-dev liblapack-dev check lcov

      # PR builds use -g -O0; all builds get HAVE_DEBUGLOG from the Makefile.
      - name: Debug-friendly C flags on pull requests
        if: github.event_name == 'pull_request'
        run: echo 'CFLAGS=-g -O0' >> $GITHUB_ENV

      # Real binary, throw-away HOME; must run before test-coverage, which
      # leaves coverage-instrumented objects behind.
      - name: Web-only startup smoke test
        run: make -j"$(nproc)" test-startup-smoke

      - name: Build and test with coverage
        env:
          PIANOBAR_INTEGRATION: "1"
          PIANOBAR_TEST_NO_DEVICE: "1"
        run: make -j"$(nproc)" test-coverage

      - name: Upload C coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: c-tests
          fail_ci_if_error: false

  # AddressSanitizer + UBSan + LeakSanitizer (LSan is enabled explicitly on
  # Linux by `make test-asan`), in parallel with c-tests; no coverage output.
  c-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libao-dev libavcodec-dev libavformat-dev \
            libavutil-dev libavfilter-dev libjson-c-dev libgcrypt20-dev \
            libcurl4-openssl-dev libwebsockets-dev libasound2-dev \
            libblas-dev liblapack-dev check

      - name: Build and test with ASan/UBSan/LSan
        env:
          PIANOBAR_INTEGRATION: "1"
          PIANOBAR_TEST_NO_DEVICE: "1"
          ASAN_OPTIONS: "detect_leaks=1"
        run: make -j"$(nproc)" test-asan

      # Same binary again with every DEBUG_* log kind on, so debug-only log
      # statements run under the sanitizers. Only failing shards are printed.
      - name: Test with ASan/UBSan/LSan and all debug logging on
        env:
          PIANOBAR_INTEGRATION: "1"
          PIANOBAR_TEST_NO_DEVICE: "1"
          PIANOBAR_TEST_DEBUG_ALL: "1"
          TEST_PAR_LOGS: failed
          ASAN_OPTIONS: "detect_leaks=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ./scripts/test-parallel.sh ./build/asan/pianobar_test

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run --coverage

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: webui/coverage
          flags: web-tests
          fail_ci_if_error: false

  # Web UI E2E against the real pianobar binary and a local fake Pandora API
  # (no account needed; see TESTING.md, "E2E without a Pandora account").
  # Pinned: ubuntu-latest is now a release Playwright cannot install browser
  # dependencies for (`playwright install --with-deps` fails there).
  e2e-fake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libao-dev libavcodec-dev libavformat-dev \
            libavutil-dev libavfilter-dev libjson-c-dev libgcrypt20-dev \
            libcurl4-openssl-dev libwebsockets-dev libasound2-dev \
            libblas-dev liblapack-dev openssl python3

      - name: Install Playwright Chromium
        run: cd webui && npm ci && npx playwright install --with-deps chromium

      - name: E2E against fake Pandora
        env:
          CI: "1"
        run: make -j"$(nproc)" test-e2e-fake
